<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/publica

    # Evitar que Apache incluya su puerto interno (10000) o esquema http en redirecciones de mod_dir detrás del proxy de Render
    UseCanonicalName Off
    UseCanonicalPhysicalPort Off

    # Reescribir encabezados Location para que sean rutas relativas y nunca contengan el puerto :10000 ni esquema http interno
    <IfModule mod_headers.c>
        Header always edit Location "^https?://[^/]+" ""
    </IfModule>

    <Directory /var/www/html/publica>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
